# Render Blueprint for Wine Prediction API
#
# This file describes the infrastructure Render will provision when you
# "Apply" this blueprint from the Render dashboard. It maps directly to:
#   - one Render Postgres database (provides DATABASE_URL)
#   - one Render Web Service (Dockerfile CMD: Thruster proxies to Puma)
#   - one Render Background Worker (runs `bin/jobs` — Solid Queue supervisor)
#
# Solid Cache, Solid Queue, and Solid Cable all share the primary database,
# so a single Postgres instance is enough. The Solid* migrations live in
# db/migrate/ alongside the rest, and `bin/rails db:prepare` (run in the
# release phase) creates all the tables on first deploy.
#
# Before applying, set these environment variables in the Render dashboard
# (or in .env / .env.production on your dev machine):
#   RAILS_MASTER_KEY   — the value of config/master.key (required for credentials)
#   APP_HOST           — the public hostname (e.g. wine-api.example.com)
#   BREVO_API_KEY      — Brevo transactional API key; the mail transport for
#                        development and production (Render free blocks the
#                        outbound SMTP ports 25/465/587)
#   SECRET_KEY_BASE    — optional; Render sets RAILS_MASTER_KEY which Rails uses
#                        to derive this via credentials, so usually not needed
#   AWS_*              — only if you wire up Active Storage on S3
#   SMTP_*             — only if you enable ActionMailer delivery
#   STRIPE_*           — only if you wire up the billing webhook

services:
  - type: pserv # Render "Web Service"
    name: wine-prediction-api
    runtime: docker
    plan: starter # change to "free" for hobby, "standard" for production
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # /up is routed to Rails::HealthController (config/routes.rb), so Render
    # only reports the deploy live once Puma accepts requests — not merely
    # when Thruster's port opens (the source of the boot-window 502s).
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wine-prediction-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false # set this manually in the Render dashboard
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      # No explicit PORT: Render injects it, and Thruster overrides PORT to
      # TARGET_PORT (3000) for the child Puma process it spawns.
      - key: WEB_CONCURRENCY
        value: "2" # keep at 2 — 10 workers OOM a starter instance
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: APP_HOST
        sync: false # set in the dashboard
      - key: TEST_ACCESS_PASSWORD
        sync: false # set in the dashboard — private test-access gate
      - key: TEST_ACCESS_TOKEN_EXPIRATION
        value: "7.days"
      - key: BREVO_API_KEY
        sync: false            # set manually in the dashboard — Brevo HTTP API key
                               # (Render free blocks outbound SMTP ports 25/465/587)
      - key: SOLID_QUEUE_IN_PUMA
        value: "false" # jobs run in the dedicated worker service, not in Puma
    # The release command runs once per deploy, after the build but
    # before the new code starts serving traffic. It creates the database
    # (idempotently) and applies all pending migrations including the
    # Solid Cache / Solid Queue / Solid Cable tables.
    releaseCommand: "bin/rails db:prepare"
    # No startCommand: the Dockerfile CMD (./bin/thrust ./bin/rails server)
    # runs Thruster on :80, which spawns and proxies to Puma on localhost:3000.
    # The service's dashboard port must therefore be 80.

  - type: pserv # Render "Background Worker"
    name: wine-prediction-worker
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wine-prediction-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: JOB_CONCURRENCY
        value: "3" # number of Solid Queue worker processes
      - key: RAILS_MAX_THREADS
        value: "5"
    releaseCommand: "bin/rails db:prepare"
    # The worker process is Solid Queue's supervisor. It dispatches jobs
    # from the queue table and runs them. `bin/jobs` is a thin wrapper
    # around `SolidQueue::Cli` that comes with the solid_queue gem.
    startCommand: "bin/jobs"

databases:
  - name: wine-prediction-db
    plan: starter # minimum paid Postgres; "free" is also fine for development
    region: oregon
    databaseName: wine_words_api_production
    user: wine_words_api
    # Render provisions this database on first apply and exposes its
    # connection string as DATABASE_URL to the services above.
