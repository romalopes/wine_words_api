# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  reconcile_subscriptions:
    class: Billing::ReconcileSubscriptionsJob
    queue: background
    schedule: every hour at minute 23
  # Wine-package review-deadline reminders (15/5/0 days before the deadline).
  # Idempotent: the 15/5/0-day notifications are keyed by
  # (package, type, due date), so a repeated run never duplicates a reminder and
  # completed/cancelled packages are skipped. Runs every morning so the
  # "deadline is today" reminder goes out on the day.
  wine_package_review_deadline_reminders:
    class: WinePackages::SendReviewDeadlineNotificationsJob
    queue: background
    schedule: at 7am every day
