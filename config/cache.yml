default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  # Solid Cache shares the primary database on Render, so no explicit
  # `database:` key is set here. If you ever split it out to a separate
  # Render Postgres, set `database: cache` (or your connection name)
  # back and add a corresponding `cache:` sub-connection in
  # config/database.yml.
  <<: *default
